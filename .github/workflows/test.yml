# Builds, type-checks, and runs every suite on each push and PR.
#
# Deploys are gated separately by `[build] command = "npm test"` in
# wrangler.toml, which Workers Builds runs before publishing. This workflow
# exists so a failure shows up on the commit rather than only at deploy time.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ required: the suites run TypeScript directly through
          # node --experimental-strip-types.
          node-version: 22
          cache: npm
      # Dependencies are required. The suites themselves import nothing, but
      # `npm test` builds first, and the build needs esbuild and typescript.
      # This step was missing when the repo moved to TypeScript: CI failed on a
      # fresh checkout while passing locally, where node_modules already existed.
      - run: npm ci
      - run: npm test
