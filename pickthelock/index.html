<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Lockpick</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas { position: fixed; inset: 0; display: block; }
  #gl { cursor: crosshair; }
  #ui { pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<script type="module">
"use strict";

import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

// Raw color pipeline: hex values pass straight through to the screen like the
// Canvas 2D version (no sRGB/linear conversions to keep art colors identical).
THREE.ColorManagement.enabled = false;

const glCanvas = document.getElementById("gl");
const ui = document.getElementById("ui").getContext("2d");

// ---------- Tunables ----------
// Values taken from Dota 2's scripts/events/dark_carnival/lockpicking/game.vdata
// (CDOTALockpickingGameDefinition, TIME_ATTACK stage). Angles in degrees there,
// converted to radians here.
const DEG = Math.PI / 180;
const START_TIME       = 30;          // m_flTimeLimit
const HIT_SCORE        = 1000;        // m_nScorePerUnlock
const BLUE_TIME_BONUS  = 1.5;         // m_flTimerIncreasePerUnlock
const BASE_SPEED      = 40 * DEG;     // m_flInitialSpeed (deg/s)
const MAX_SPEED_MULT  = 3.2;          // m_flMaxSpeedMultiplier (boost cap)
const BOOST_RAMP      = 6 * 0.12 * 1.4; // m_flSpeedBoostRate * m_flSpeedBoostPercentage,
                                      // scaled 1.4x by feel: multiplier compounds at ~1x/s
                                      // while held, hitting the 3.2x cap in ~1.1s
const BOOST_DECAY     = 2.5;          // release decay (not in vdata; tuned to feel snappy)
const MISS_STALL      = 0.3;          // dwell at full stop after a miss (not in vdata; tuned)
// Miss penalty: the needle stops dead instantly, stalls briefly, then snaps back
// up to speed. (vdata has m_flDecelerationRate=3 / m_flRecoverRate=60 but the
// exact formulas are compiled; these are tuned to match the real game's feel.)
const RECOVER_ACCEL   = 180 * DEG;    // deg/s^2 back up to speed (~0.22s to base)
const WEDGE_SIZE      = 2 * Math.asin(40 / 180); // m_nUnlockRadius=40 is a circle radius in
                                      // board units (m_nBoardRadius=180): ~25.7 deg of arc.
                                      // Verified by measuring wedges in a gameplay screenshot
                                      // (widest observed 23.5 deg, shrinking at 3 deg/s).
const WEDGE_SHRINK    = 3 * DEG;      // m_flUnlockDegreeDecreaseRate (deg/s per side)
const MIN_GAP         = 20 * DEG;     // m_flMinDegreesBetweenUnlocks (center-to-center)
const SPAWN_BASE      = 1.4;          // m_flBaseUnlockAppearRate (s between spawns)
const SPAWN_RAMP      = 0.04;         // m_flUnlockAppearIncreaseRate (interval shrink /s)
const SPAWN_MIN       = 0.3;          // floor for the spawn interval
const MAX_ARCS        = 6;            // m_nMaxUnlocksOnBoard
const BLUE_BASE_CHANCE = 0.15;        // m_flTimerIncreaseUnlockChance (%)
const BLUE_ESCALATION  = 0.04;        // m_flTimerIncreaseUnlockEscalatingChance (%/spawn)
const NEEDLE_GRACE     = 2.0 * DEG;   // hit tolerance beyond wedge edges
const TAU = Math.PI * 2;

const FONT = 'Georgia, "Times New Roman", serif';

// ---------- Assets ----------
const TEX_NAMES = {
  bg:    "assets/lockpicking_background_psd.png",
  lock:  "assets/lock_background_psd.png",
  dial:  "assets/lock_dial_psd.png",
  shank: "assets/lock_shank_psd.png",
  slark: "assets/slark_head_psd.png",
};
// slark head is an 8x8 sprite sheet of 420x500 frames (blink/eye variants)
const SLARK_COLS = 8, SLARK_ROWS = 8;
let slarkBlink = 0;      // time left showing the blink frame
let slarkReact = 0;      // time left showing the reaction frame (on capture)
let slarkNext = 2;       // countdown to the next idle blink

const TEX = {};
const signImg = new Image();   // sign renders on the 2D UI layer
signImg.src = "assets/sign_psd.png";
let assetsReady = false;

const SFX = {
  success: "assets/lockpick_success.mp3",
  miss:    "assets/lockpick_break.mp3",
  boost:   "assets/lockpick_boost.mp3",
};
function playSfx(name, vol = 0.6) {
  const a = new Audio(SFX[name]);
  a.volume = vol;
  a.play().catch(() => {}); // ignore autoplay restrictions
}

// ---------- Layout ----------
// Lock geometry (measured from lock_background_psd.png):
// image is 700x700, face circle center (345,346) radius 345,
// recessed hole (where wedges live) starts at 0.82 of that radius.
const HOLE_FRAC = 0.82;
const LOCK_CX_FRAC = 345 / 700, LOCK_CY_FRAC = 346 / 700, LOCK_R_FRAC = 345 / 700;
let W, H, CX, CY, R_LOCK, R_HOLE, R_DIAL, R_WEDGE_IN, R_WEDGE_OUT;

// ---------- Game state ----------
let phase = "menu";           // menu | playing | gameover
let timeLeft, score, elapsed;
let angle, dir;               // needle angle (rad), direction (+1 ccw / -1 cw in math coords)
let curSpeed;                 // actual needle speed (rad/s)
let boostMult;                // 1..MAX_SPEED_MULT, ramps while RMB held
let missState;                // 0 = normal, 2 = stalled, 3 = recovering
let stallTimer;               // countdown for the full-stop dwell
let blueChance;               // escalating pity chance for blue wedges
let fastHeld = false;
let spawnTimer;
let arcs = [];                // {center, half, color}
let floaters = [];            // {x, y, text, color, age}
let centerFloaters = [];      // "+1.5" style popups on the dial {text, color, age}
let flashes = [];             // rim flashes {color, age}
let sparkles = [];            // needle trail + capture bursts
                              // {x, y, vx, vy, age, life, size, color:[r,g,b], drag, grav}
let timerPulse = 0;
let best = 0;

function reset() {
  timeLeft = START_TIME;
  score = 0;
  elapsed = 0;
  angle = -Math.PI / 2;
  dir = 1;
  curSpeed = BASE_SPEED;
  boostMult = 1;
  missState = 0;
  stallTimer = 0;
  blueChance = BLUE_BASE_CHANCE;
  spawnTimer = 0.4;
  arcs = [];
  floaters = [];
  centerFloaters = [];
  flashes = [];
  sparkles = [];
  timerPulse = 0;
}

// ---------- Angle helpers ----------
function norm(a) {
  a %= TAU;
  return a < 0 ? a + TAU : a;
}
function angDist(a, b) {
  const d = Math.abs(norm(a) - norm(b));
  return Math.min(d, TAU - d);
}
function needleOnArc(arc) {
  return angDist(angle, arc.center) <= arc.half + NEEDLE_GRACE;
}

function hexRGB(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

// spark burst at the needle's position on the ring when a wedge is captured
const BURST_PALETTES = {
  blue:   ["#6fc3ff", "#a8dcff", "#ffffff", "#3fa9ff"].map(hexRGB),
  yellow: ["#ffdf6b", "#ffc93f", "#ffffff", "#ffb347"].map(hexRGB),
};
const TRAIL_COLOR = hexRGB("#b48cff");
function spawnBurst(ang, color) {
  const r0 = (R_WEDGE_IN + R_WEDGE_OUT) / 2;
  const bx = CX + Math.cos(ang) * r0;
  const by = CY - Math.sin(ang) * r0;
  const palette = BURST_PALETTES[color];
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * TAU;
    const sp = 60 + Math.random() * 260;
    sparkles.push({
      x: bx, y: by,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      age: 0, life: 0.45 + Math.random() * 0.45,
      size: 3 + Math.random() * 4.5,
      color: palette[(Math.random() * palette.length) | 0],
      drag: 2.5, grav: 140,
    });
  }
}

// ---------- Spawning ----------
function trySpawnArc() {
  if (arcs.length >= MAX_ARCS) return;
  const half = WEDGE_SIZE / 2;
  for (let attempt = 0; attempt < 12; attempt++) {
    const center = Math.random() * TAU;
    // keep new wedges from spawning right under the needle
    if (angDist(center, angle) < half + 0.25) continue;
    let clear = true;
    for (const a of arcs) {
      // MIN_GAP is center-to-center (wedges may spawn touching edge-to-edge);
      // the max() only prevents actual overlap with wider neighbors
      if (angDist(center, a.center) < Math.max(half + a.half, MIN_GAP)) { clear = false; break; }
    }
    if (clear) {
      // escalating pity: each yellow spawn raises the blue chance until one lands
      const isBlue = Math.random() < blueChance;
      blueChance = isBlue ? BLUE_BASE_CHANCE : blueChance + BLUE_ESCALATION;
      arcs.push({ center, half, color: isBlue ? "blue" : "yellow" });
      return;
    }
  }
}

// ---------- Input ----------
glCanvas.addEventListener("contextmenu", e => e.preventDefault());

function startRun() {
  reset();
  phase = "playing";
}

glCanvas.addEventListener("mousedown", e => {
  if (e.button === 2) {
    if (!fastHeld) playSfx("boost", 0.45);
    fastHeld = true;
    return;
  }
  if (e.button !== 0) return;

  if (phase === "menu" || phase === "gameover") {
    startRun();
    return;
  }

  // left click during play: try to capture
  let hitIndex = -1;
  for (let i = 0; i < arcs.length; i++) {
    if (needleOnArc(arcs[i])) { hitIndex = i; break; }
  }
  if (hitIndex >= 0) {
    const arc = arcs[hitIndex];
    score += HIT_SCORE;
    playSfx("success", 0.6);
    if (arc.color === "blue") {
      timeLeft += BLUE_TIME_BONUS;
      timerPulse = 1;
      centerFloaters.push({ text: "+" + BLUE_TIME_BONUS.toFixed(1), color: "#7fd0ff", age: 0 });
    }
    dir = -dir;      // reverse direction, same speed
    missState = 0;   // capturing clears any slow penalty
    curSpeed = BASE_SPEED * boostMult;
    const fr = (R_WEDGE_IN + R_WEDGE_OUT) / 2;
    floaters.push({
      x: CX + Math.cos(arc.center) * fr,
      y: CY - Math.sin(arc.center) * fr,
      text: "+" + HIT_SCORE, color: "#ffe98a", age: 0,
    });
    flashes.push({ color: arc.color === "blue" ? "#4db8ff" : "#ffd23f", age: 0 });
    spawnBurst(angle, arc.color);
    slarkReact = 0.35;
    arcs.splice(hitIndex, 1);
  } else {
    // miss: instant dead stop, brief stall, then quick recovery.
    // Boost is forfeited — it must recompound from 1x after recovery.
    // Clicks during an active penalty are ignored (no vdata cooldown param
    // exists; the penalty itself is the minimum interval between misses).
    if (missState !== 0) return;
    curSpeed = 0;
    missState = 2;
    stallTimer = MISS_STALL;
    boostMult = 1;
    playSfx("miss", 0.6);
    flashes.push({ color: "#ff4d4d", age: 0 });
  }
});

window.addEventListener("mouseup", e => {
  if (e.button === 2) fastHeld = false;
});
window.addEventListener("blur", () => { fastHeld = false; });

window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") startRun();
});

// ---------- Update ----------
function update(dt) {
  // effects keep animating even on menu/gameover screens
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].age += dt;
    if (floaters[i].age > 1.1) floaters.splice(i, 1);
  }
  for (let i = centerFloaters.length - 1; i >= 0; i--) {
    centerFloaters[i].age += dt;
    if (centerFloaters[i].age > 1.0) centerFloaters.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].age += dt;
    if (flashes[i].age > 0.35) flashes.splice(i, 1);
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.age += dt;
    if (s.drag) {
      const d = Math.max(0, 1 - s.drag * dt);
      s.vx *= d; s.vy *= d;
    }
    if (s.grav) s.vy += s.grav * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.age > s.life) sparkles.splice(i, 1);
  }
  timerPulse = Math.max(0, timerPulse - dt * 2.5);

  // slark idle blinking
  slarkBlink = Math.max(0, slarkBlink - dt);
  slarkReact = Math.max(0, slarkReact - dt);
  slarkNext -= dt;
  if (slarkNext <= 0) {
    slarkBlink = 0.13;
    slarkNext = 2 + Math.random() * 3;
  }

  if (phase !== "playing") return;

  elapsed += dt;
  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    phase = "gameover";
    best = Math.max(best, score);
    return;
  }

  // boost multiplier compounds while RMB is held, decays when released.
  // It is pinned at 1x for the duration of the miss penalty.
  if (missState === 0) {
    if (fastHeld) {
      boostMult = Math.min(MAX_SPEED_MULT, boostMult * (1 + BOOST_RAMP * dt));
    } else {
      boostMult = Math.max(1, boostMult * (1 - BOOST_DECAY * dt));
    }
  }
  const targetSpeed = BASE_SPEED * boostMult;

  if (missState === 2) {
    // dwell at a full stop so the miss reads clearly
    stallTimer -= dt;
    if (stallTimer <= 0) missState = 3;
  } else if (missState === 3) {
    // constant acceleration back up to speed
    curSpeed += RECOVER_ACCEL * dt;
    if (curSpeed >= targetSpeed) { curSpeed = targetSpeed; missState = 0; }
  } else {
    curSpeed = targetSpeed;
  }
  angle = norm(angle + dir * curSpeed * dt);

  // needle sparkle trail
  for (let i = 0; i < 2; i++) {
    const rr = R_DIAL * 0.3 + Math.random() * (R_WEDGE_OUT - R_DIAL * 0.3);
    const jitter = (Math.random() - 0.5) * 0.05;
    sparkles.push({
      x: CX + Math.cos(angle + jitter) * rr,
      y: CY - Math.sin(angle + jitter) * rr,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      age: 0, life: 0.5,
      size: 3.2, color: TRAIL_COLOR,
      drag: 0, grav: 0,
    });
  }

  // wedges shrink and expire (WEDGE_SHRINK deg/s per side, so a fresh
  // wedge lasts ~4.3s — matches the original's faster decay)
  for (let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i];
    a.half -= WEDGE_SHRINK * dt;
    if (a.half <= 1 * DEG) arcs.splice(i, 1);
  }

  // spawn rate ramps up over time
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    trySpawnArc();
    spawnTimer = Math.max(SPAWN_MIN, SPAWN_BASE - elapsed * SPAWN_RAMP);
  }
}

// ---------- Three.js scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // raw pass-through, no brightening
const scene = new THREE.Scene();
// pixel-space orthographic camera, y pointing down like Canvas 2D
const camera = new THREE.OrthographicCamera(0, 1, 0, 1, -1000, 1000);
let composer, bloomPass;

const unitPlane = new THREE.PlaneGeometry(1, 1);
function spriteMesh(tex, order) {
  const m = new THREE.Mesh(unitPlane, new THREE.MeshBasicMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  }));
  m.renderOrder = order;
  scene.add(m);
  return m;
}

let bgMesh, slarkMesh, shankMesh, lockMesh, dialMesh;
let wedgeMeshes = [];
let needleMesh, tipMesh, points, pointsGeom;
const MAX_PARTICLES = 800;

const WEDGE_COLORS = {
  yellow: { c0: hexRGB("#7a5c14"), c1: hexRGB("#d9a721"), c2: hexRGB("#ffdf6b"), rim: hexRGB("#fff0b4") },
  blue:   { c0: hexRGB("#1d3f6e"), c1: hexRGB("#2f7fd6"), c2: hexRGB("#6fc3ff"), rim: hexRGB("#b4e1ff") },
};

const wedgeShader = {
  vertexShader: /* glsl */`
    varying vec2 vLocal;
    void main() {
      vLocal = position.xy; // [-1,1] quad, y up in local space
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform float uCenter, uHalf, uRIn, uROut, uLockSize;
    uniform vec2 uLockC;
    uniform vec3 uC0, uC1, uC2, uRim;
    uniform sampler2D uLockTex;
    varying vec2 vLocal;
    const float PI = 3.14159265359;
    void main() {
      float r = length(vLocal);
      if (r > 1.0 || r < uRIn) discard;
      // math-convention angle (local y is up, so this matches game angles)
      float ang = atan(vLocal.y, vLocal.x);
      float d = abs(mod(ang - uCenter + PI, 2.0 * PI) - PI);
      if (d > uHalf) discard;
      // three-stop radial gradient (matches the canvas version's stops)
      float t = clamp((r - uRIn) / (1.0 - uRIn), 0.0, 1.0);
      vec3 col = t < 0.55 ? mix(uC0, uC1, t / 0.55)
                          : mix(uC1, uC2, (t - 0.55) / 0.45);
      // lock face scratches composited in (grayscale, brightness 4, contrast 1.8,
      // overlay blend) so the wedge reads as a tinted overlay on the metal
      vec2 world = vec2(vLocal.x, -vLocal.y) * uROut; // to y-down image space
      vec2 uv = (world + uLockC * uLockSize) / uLockSize;
      vec3 tex = texture2D(uLockTex, vec2(uv.x, 1.0 - uv.y)).rgb;
      float lum = dot(tex, vec3(0.299, 0.587, 0.114));
      lum = clamp((lum * 4.0 - 0.5) * 1.8 + 0.5, 0.0, 1.0);
      vec3 ov = mix(2.0 * col * lum,
                    1.0 - 2.0 * (1.0 - col) * (1.0 - lum),
                    step(0.5, lum));
      col = mix(col, ov, 0.9);
      // beveled light edge, ~2px
      float edgeA = (uHalf - d) * max(r, 0.05) * uROut;
      float edgeR = min(r - uRIn, 1.0 - r) * uROut;
      float rimK = 1.0 - smoothstep(0.0, 2.0, min(edgeA, edgeR));
      col = mix(col, uRim, rimK * 0.55);
      gl_FragColor = vec4(col, 1.0);
    }`,
};

const needleShader = {
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uA, uB;
    varying vec2 vUv;
    void main() {
      float t = vUv.x;
      vec3 col = mix(uA, uB, smoothstep(0.35, 1.0, t));
      float alpha = clamp(t / 0.35, 0.0, 1.0);
      // soften the long edges
      alpha *= smoothstep(1.0, 0.45, abs(vUv.y * 2.0 - 1.0));
      gl_FragColor = vec4(col, alpha);
    }`,
};

const NEEDLE_COLORS = {
  normal:    { a: hexRGB("#8a5cff"), b: hexRGB("#e6d8ff"), tip: hexRGB("#f0e8ff") },
  penalized: { a: hexRGB("#ff8d6b"), b: hexRGB("#ffd0b8"), tip: hexRGB("#ffd0b8") },
};

const pointShader = {
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aAlpha;
    attribute vec3 aColor;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uDpr;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha;
      gl_PointSize = aSize * uDpr;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = vAlpha * smoothstep(0.5, 0.12, d);
      gl_FragColor = vec4(vColor * a, a);
    }`,
};

function buildScene() {
  bgMesh = spriteMesh(TEX.bg, 0);
  bgMesh.material.transparent = false;
  slarkMesh = spriteMesh(TEX.slark, 10);
  TEX.slark.repeat.set(1 / SLARK_COLS, 1 / SLARK_ROWS);
  shankMesh = spriteMesh(TEX.shank, 20);
  lockMesh = spriteMesh(TEX.lock, 30);

  for (let i = 0; i < MAX_ARCS; i++) {
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uCenter: { value: 0 }, uHalf: { value: 0 },
        uRIn: { value: 0.6 }, uROut: { value: 100 },
        uLockSize: { value: 100 }, uLockC: { value: new THREE.Vector2(LOCK_CX_FRAC, LOCK_CY_FRAC) },
        uC0: { value: new THREE.Vector3() }, uC1: { value: new THREE.Vector3() },
        uC2: { value: new THREE.Vector3() }, uRim: { value: new THREE.Vector3() },
        uLockTex: { value: TEX.lock },
      },
      vertexShader: wedgeShader.vertexShader,
      fragmentShader: wedgeShader.fragmentShader,
      transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
    m.renderOrder = 40;
    m.visible = false;
    scene.add(m);
    wedgeMeshes.push(m);
  }

  // particles between wedges and needle
  pointsGeom = new THREE.BufferGeometry();
  pointsGeom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAX_PARTICLES * 3), 3));
  pointsGeom.setAttribute("aColor", new THREE.BufferAttribute(new Float32Array(MAX_PARTICLES * 3), 3));
  pointsGeom.setAttribute("aSize", new THREE.BufferAttribute(new Float32Array(MAX_PARTICLES), 1));
  pointsGeom.setAttribute("aAlpha", new THREE.BufferAttribute(new Float32Array(MAX_PARTICLES), 1));
  points = new THREE.Points(pointsGeom, new THREE.ShaderMaterial({
    uniforms: { uDpr: { value: 1 } },
    vertexShader: pointShader.vertexShader,
    fragmentShader: pointShader.fragmentShader,
    transparent: true, depthTest: false, depthWrite: false,
    blending: THREE.AdditiveBlending,
  }));
  points.renderOrder = 45;
  points.frustumCulled = false;
  scene.add(points);

  // needle: unit quad anchored at its inner end
  const ng = new THREE.PlaneGeometry(1, 1);
  ng.translate(0.5, 0, 0);
  needleMesh = new THREE.Mesh(ng, new THREE.ShaderMaterial({
    uniforms: {
      uA: { value: new THREE.Vector3(...NEEDLE_COLORS.normal.a) },
      uB: { value: new THREE.Vector3(...NEEDLE_COLORS.normal.b) },
    },
    vertexShader: needleShader.vertexShader,
    fragmentShader: needleShader.fragmentShader,
    transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  }));
  needleMesh.renderOrder = 50;
  scene.add(needleMesh);

  tipMesh = new THREE.Mesh(new THREE.CircleGeometry(1, 24), new THREE.MeshBasicMaterial({
    color: new THREE.Color(...NEEDLE_COLORS.normal.tip),
    transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  }));
  tipMesh.renderOrder = 51;
  scene.add(tipMesh);

  dialMesh = spriteMesh(TEX.dial, 60);
}

// ---------- Sizing ----------
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;

  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H, false);
  camera.left = 0; camera.right = W;
  camera.top = 0; camera.bottom = H;
  camera.updateProjectionMatrix();
  if (composer) {
    composer.setPixelRatio(dpr);
    composer.setSize(W, H);
  }

  const uiCanvas = ui.canvas;
  uiCanvas.width = W * dpr;
  uiCanvas.height = H * dpr;
  uiCanvas.style.width = W + "px";
  uiCanvas.style.height = H + "px";
  ui.setTransform(dpr, 0, 0, dpr, 0, 0);

  R_LOCK = Math.min(W * 0.44, H * 0.34);  // drawn radius of the lock face
  R_HOLE = R_LOCK * HOLE_FRAC;
  R_WEDGE_OUT = R_HOLE * 0.99;
  R_DIAL = R_HOLE * 0.62;
  R_WEDGE_IN = R_DIAL * 1.01;
  CX = W / 2;
  CY = H * 0.60;                          // lock sits below center, sign above

  if (assetsReady) layout();
}

function layout() {
  // background cover-fit
  const bt = TEX.bg.image;
  const s = Math.max(W / bt.width, H / bt.height);
  bgMesh.scale.set(bt.width * s, bt.height * s, 1);
  bgMesh.position.set(W / 2, H / 2, 0);

  const headW = R_LOCK * 1.05;
  const headH = headW * (500 / 420);
  slarkMesh.scale.set(headW, headH, 1);
  slarkMesh.position.set(CX, CY - R_LOCK * 0.55 - headH / 2, 0);

  const shW = R_LOCK * 1.5;
  const shH = shW * (TEX.shank.image.height / TEX.shank.image.width);
  shankMesh.scale.set(shW, shH, 1);
  shankMesh.position.set(CX, CY - R_LOCK * 0.55 - shH / 2, 0);

  const lockDrawW = R_LOCK / LOCK_R_FRAC;
  lockMesh.scale.set(lockDrawW, lockDrawW, 1);
  // lock face circle center sits at (CX, CY) -> offset the image accordingly
  lockMesh.position.set(
    CX + lockDrawW * (0.5 - LOCK_CX_FRAC),
    CY + lockDrawW * (0.5 - LOCK_CY_FRAC), 0);

  for (const m of wedgeMeshes) {
    m.scale.set(R_WEDGE_OUT, R_WEDGE_OUT, 1);
    m.position.set(CX, CY, 0);
    m.material.uniforms.uRIn.value = R_WEDGE_IN / R_WEDGE_OUT;
    m.material.uniforms.uROut.value = R_WEDGE_OUT;
    m.material.uniforms.uLockSize.value = lockDrawW;
  }

  needleMesh.scale.set(R_WEDGE_OUT, 3.2, 1);
  needleMesh.position.set(CX, CY, 0);
  tipMesh.scale.set(3, 3, 1);

  dialMesh.scale.set(R_DIAL * 2, R_DIAL * 2, 1);
  dialMesh.position.set(CX, CY, 0);
}

// ---------- Per-frame visual sync ----------
function syncScene() {
  // slark sprite frame: reaction wins over blink, else idle
  const frame = slarkReact > 0 ? 8 : (slarkBlink > 0 ? 1 : 0);
  const col = frame % SLARK_COLS, row = Math.floor(frame / SLARK_COLS);
  TEX.slark.offset.set(col / SLARK_COLS, 1 - (row + 1) / SLARK_ROWS);

  // wedges
  for (let i = 0; i < wedgeMeshes.length; i++) {
    const m = wedgeMeshes[i];
    if (i < arcs.length) {
      const a = arcs[i];
      const cset = WEDGE_COLORS[a.color];
      m.visible = true;
      m.material.uniforms.uCenter.value = a.center;
      m.material.uniforms.uHalf.value = a.half;
      m.material.uniforms.uC0.value.set(...cset.c0);
      m.material.uniforms.uC1.value.set(...cset.c1);
      m.material.uniforms.uC2.value.set(...cset.c2);
      m.material.uniforms.uRim.value.set(...cset.rim);
    } else {
      m.visible = false;
    }
  }

  // needle (world y is down; rotation.z is negated to keep math convention)
  needleMesh.rotation.z = -angle;
  const nc = missState !== 0 ? NEEDLE_COLORS.penalized : NEEDLE_COLORS.normal;
  needleMesh.material.uniforms.uA.value.set(...nc.a);
  needleMesh.material.uniforms.uB.value.set(...nc.b);
  tipMesh.position.set(CX + Math.cos(angle) * R_WEDGE_OUT,
                       CY - Math.sin(angle) * R_WEDGE_OUT, 0);
  tipMesh.material.color.setRGB(...nc.tip);

  // particles
  const pos = pointsGeom.attributes.position.array;
  const colA = pointsGeom.attributes.aColor.array;
  const sizeA = pointsGeom.attributes.aSize.array;
  const alphaA = pointsGeom.attributes.aAlpha.array;
  const n = Math.min(sparkles.length, MAX_PARTICLES);
  for (let i = 0; i < n; i++) {
    const s = sparkles[i];
    const k = 1 - s.age / s.life;
    pos[i * 3] = s.x; pos[i * 3 + 1] = s.y; pos[i * 3 + 2] = 0;
    colA[i * 3] = s.color[0]; colA[i * 3 + 1] = s.color[1]; colA[i * 3 + 2] = s.color[2];
    sizeA[i] = s.size * k + 1;
    alphaA[i] = 0.8 * k;
  }
  pointsGeom.setDrawRange(0, n);
  pointsGeom.attributes.position.needsUpdate = true;
  pointsGeom.attributes.aColor.needsUpdate = true;
  pointsGeom.attributes.aSize.needsUpdate = true;
  pointsGeom.attributes.aAlpha.needsUpdate = true;
  points.material.uniforms.uDpr.value = window.devicePixelRatio || 1;
}

// ---------- 2D UI layer ----------
function smallCaps(text, x, y, sizePx, color, spacing) {
  ui.font = `600 ${sizePx}px ${FONT}`;
  ui.fillStyle = color;
  const chars = text.split("");
  let total = 0;
  for (const c of chars) total += ui.measureText(c).width + spacing;
  total -= spacing;
  let cx = x - total / 2;
  ui.textAlign = "left";
  for (const c of chars) {
    ui.fillText(c, cx, y);
    cx += ui.measureText(c).width + spacing;
  }
  ui.textAlign = "center";
}

function drawSign() {
  const signW = Math.min(W * 0.42, R_LOCK * 1.35);
  const signH = signW * (signImg.height / signImg.width);
  const signX = CX - signW / 2;
  const signY = -signH * 0.06; // chains run off the top of the screen
  ui.drawImage(signImg, signX, signY, signW, signH);
  ui.textAlign = "center";
  ui.textBaseline = "middle";
  ui.font = `700 ${Math.round(signW * 0.085)}px ${FONT}`;
  ui.fillStyle = "#d9c18a";
  ui.shadowColor = "#000";
  ui.shadowBlur = 6;
  ui.fillText("PICK THE LOCK", CX, signY + signH * 0.70);
  ui.shadowBlur = 0;
}

function drawUI() {
  ui.clearRect(0, 0, W, H);

  if (!assetsReady) {
    ui.fillStyle = "#8d8578";
    ui.font = `500 16px ${FONT}`;
    ui.textAlign = "center";
    ui.textBaseline = "middle";
    ui.fillText("Loading…", W / 2, H / 2);
    return;
  }

  // rim flashes (hit/miss feedback) around the lock
  for (const f of flashes) {
    const k = 1 - f.age / 0.35;
    ui.beginPath();
    ui.arc(CX, CY, R_LOCK + 4 + 10 * k, 0, TAU);
    ui.strokeStyle = f.color;
    ui.globalAlpha = 0.45 * k;
    ui.lineWidth = 8 + 10 * k;
    ui.stroke();
    ui.globalAlpha = 1;
  }

  drawSign();

  // center text: +bonus / TIME REMAINING / time / SCORE / score
  if (phase !== "menu") {
    ui.textAlign = "center";
    ui.textBaseline = "middle";

    for (const f of centerFloaters) {
      const k = f.age / 1.0;
      ui.globalAlpha = 1 - k;
      ui.font = `700 ${Math.round(R_DIAL * 0.2)}px ${FONT}`;
      ui.fillStyle = f.color;
      ui.fillText(f.text, CX, CY - R_DIAL * 0.52 - k * 14);
      ui.globalAlpha = 1;
    }

    smallCaps("TIME REMAINING", CX, CY - R_DIAL * 0.26, Math.round(R_DIAL * 0.11), "#8d8578", 2);

    const pulse = timerPulse;
    let timerColor = "#efe9dc";
    if (pulse > 0) timerColor = "#6effa1";
    else if (phase === "playing" && timeLeft < 5) timerColor = "#ff6b6b";
    ui.font = `700 ${Math.round(R_DIAL * 0.5)}px ${FONT}`;
    ui.fillStyle = timerColor;
    ui.shadowColor = timerColor;
    ui.shadowBlur = pulse > 0 ? 22 * pulse : 6;
    ui.fillText(timeLeft.toFixed(1), CX, CY + R_DIAL * 0.06);
    ui.shadowBlur = 0;

    smallCaps("SCORE", CX, CY + R_DIAL * 0.42, Math.round(R_DIAL * 0.11), "#8d8578", 2);
    ui.font = `700 ${Math.round(R_DIAL * 0.22)}px ${FONT}`;
    ui.fillStyle = "#ffe98a";
    ui.fillText(score.toLocaleString(), CX, CY + R_DIAL * 0.66);
  }

  // floating score texts over the ring
  for (const f of floaters) {
    const k = f.age / 1.1;
    ui.globalAlpha = 1 - k;
    ui.font = `700 ${Math.round(R_LOCK * 0.09)}px ${FONT}`;
    ui.fillStyle = f.color;
    ui.textAlign = "center";
    ui.fillText(f.text, f.x, f.y - k * 40);
    ui.globalAlpha = 1;
  }

  // overlays
  if (phase === "menu") {
    drawOverlayText(
      "Left click when the needle is over a zone • blue zones give +1.5s",
      "Hold right mouse to speed up • missing slows you down • R restarts",
      "Click to start");
  } else if (phase === "gameover") {
    drawOverlayText(
      "Final score: " + score.toLocaleString(),
      best > 0 ? "Best: " + best.toLocaleString() : "",
      "Click or press R to play again");
  } else {
    ui.textAlign = "center";
    ui.font = `500 13px ${FONT}`;
    ui.fillStyle = "rgba(200,190,170,0.55)";
    ui.fillText("LMB capture • hold RMB to speed up • R to restart", CX, H - 14);
  }
}

function drawOverlayText(line1, line2, cta) {
  ui.fillStyle = "rgba(8,7,9,0.55)";
  ui.fillRect(0, 0, W, H);
  drawSign(); // keep the title bright above the dim layer

  ui.textAlign = "center";
  ui.textBaseline = "middle";
  ui.font = `500 ${Math.round(R_LOCK * 0.07)}px ${FONT}`;
  ui.fillStyle = "#cfc4a6";
  if (line1) ui.fillText(line1, CX, CY - R_LOCK * 0.15);
  if (line2) ui.fillText(line2, CX, CY);
  const blink = 0.6 + 0.4 * Math.sin(performance.now() / 300);
  ui.globalAlpha = blink;
  ui.font = `700 ${Math.round(R_LOCK * 0.09)}px ${FONT}`;
  ui.fillStyle = "#ffe98a";
  ui.fillText(cta, CX, CY + R_LOCK * 0.3);
  ui.globalAlpha = 1;
}

// ---------- Boot ----------
const loader = new THREE.TextureLoader();
async function loadAssets() {
  const entries = Object.entries(TEX_NAMES);
  const texes = await Promise.all(entries.map(([k, src]) => loader.loadAsync(src)));
  entries.forEach(([k], i) => {
    const t = texes[i];
    t.colorSpace = THREE.NoColorSpace;
    t.minFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    TEX[k] = t;
  });
  if (!signImg.complete) await new Promise(res => { signImg.onload = res; signImg.onerror = res; });

  buildScene();
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.4, 0.62);
  composer.addPass(bloomPass);
  assetsReady = true;
  resize(); // now that meshes exist, lay them out
}

reset(); // initialize state so the first frame has a valid needle angle
if (location.hash === "#autostart") startRun(); // for automated screenshots/testing
resize();
loadAssets();

let lastT = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min((now - lastT) / 1000, 0.05)); // clamp tab-switch jumps / non-monotonic timestamps
  lastT = now;
  update(dt);
  if (assetsReady) {
    syncScene();
    composer.render();
  }
  drawUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("resize", resize);
</script>
</body>
</html>
