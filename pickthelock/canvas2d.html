<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Lockpick</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------- Tunables ----------
// Values taken from Dota 2's scripts/events/dark_carnival/lockpicking/game.vdata
// (CDOTALockpickingGameDefinition, TIME_ATTACK stage). Angles in degrees there,
// converted to radians here.
const DEG = Math.PI / 180;
const START_TIME       = 30;          // m_flTimeLimit
const HIT_SCORE        = 1000;        // m_nScorePerUnlock
const BLUE_TIME_BONUS  = 1.5;         // m_flTimerIncreasePerUnlock
const BASE_SPEED      = 40 * DEG;     // m_flInitialSpeed (deg/s)
const MAX_SPEED_MULT  = 3.2;          // m_flMaxSpeedMultiplier (boost cap)
const BOOST_RAMP      = 6 * 0.12 * 1.4; // m_flSpeedBoostRate * m_flSpeedBoostPercentage,
                                      // scaled 1.4x by feel: multiplier compounds at ~1x/s
                                      // while held, hitting the 3.2x cap in ~1.1s
const BOOST_DECAY     = 2.5;          // release decay (not in vdata; tuned to feel snappy)
const MISS_STALL      = 0.3;          // dwell at full stop after a miss (not in vdata; tuned)
// Miss penalty: the needle stops dead instantly, stalls briefly, then snaps back
// up to speed. (vdata has m_flDecelerationRate=3 / m_flRecoverRate=60 but the
// exact formulas are compiled; these are tuned to match the real game's feel.)
const RECOVER_ACCEL   = 180 * DEG;    // deg/s^2 back up to speed (~0.22s to base)
const WEDGE_SIZE      = 2 * Math.asin(40 / 180); // m_nUnlockRadius=40 is a circle radius in
                                      // board units (m_nBoardRadius=180): ~25.7 deg of arc.
                                      // Verified by measuring wedges in a gameplay screenshot
                                      // (widest observed 23.5 deg, shrinking at 3 deg/s).
const WEDGE_SHRINK    = 3 * DEG;      // m_flUnlockDegreeDecreaseRate (deg/s)
const MIN_GAP         = 20 * DEG;     // m_flMinDegreesBetweenUnlocks
const SPAWN_BASE      = 1.4;          // m_flBaseUnlockAppearRate (s between spawns)
const SPAWN_RAMP      = 0.04;         // m_flUnlockAppearIncreaseRate (interval shrink /s)
const SPAWN_MIN       = 0.3;          // floor for the spawn interval
const MAX_ARCS        = 6;            // m_nMaxUnlocksOnBoard
const BLUE_BASE_CHANCE = 0.15;        // m_flTimerIncreaseUnlockChance (%)
const BLUE_ESCALATION  = 0.04;        // m_flTimerIncreaseUnlockEscalatingChance (%/spawn)
const NEEDLE_GRACE     = 2.0 * DEG;   // hit tolerance beyond wedge edges
const TAU = Math.PI * 2;

const FONT = 'Georgia, "Times New Roman", serif';

// ---------- Assets ----------
const IMG_NAMES = {
  bg:    "assets/lockpicking_background_psd.png",
  lock:  "assets/lock_background_psd.png",
  dial:  "assets/lock_dial_psd.png",
  shank: "assets/lock_shank_psd.png",
  sign:  "assets/sign_psd.png",
  slark: "assets/slark_head_psd.png",
};
// slark head is an 8x8 sprite sheet of 420x500 frames (blink/eye variants)
const SLARK_FW = 420, SLARK_FH = 500, SLARK_COLS = 8;
let slarkBlink = 0;      // time left showing the blink frame
let slarkReact = 0;      // time left showing the reaction frame (on capture)
let slarkNext = 2;       // countdown to the next idle blink
const IMGS = {};
let imgsLoaded = 0;
const imgsTotal = Object.keys(IMG_NAMES).length;
for (const [k, src] of Object.entries(IMG_NAMES)) {
  const im = new Image();
  im.onload = () => imgsLoaded++;
  im.src = src;
  IMGS[k] = im;
}

const SFX = {
  success: "assets/lockpick_success.mp3",
  miss:    "assets/lockpick_break.mp3",
  boost:   "assets/lockpick_boost.mp3",
};
function playSfx(name, vol = 0.6) {
  const a = new Audio(SFX[name]);
  a.volume = vol;
  a.play().catch(() => {}); // ignore autoplay restrictions
}

// ---------- Canvas sizing / layout ----------
// Lock geometry (measured from lock_background_psd.png):
// image is 700x700, face circle center (345,346) radius 345,
// recessed hole (where wedges live) starts at 0.82 of that radius.
const HOLE_FRAC = 0.82;
let W, H, CX, CY, R_LOCK, R_HOLE, R_DIAL, R_WEDGE_IN, R_WEDGE_OUT;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R_LOCK = Math.min(W * 0.44, H * 0.34);  // drawn radius of the lock face
  R_HOLE = R_LOCK * HOLE_FRAC;
  R_WEDGE_OUT = R_HOLE * 0.99;
  R_DIAL = R_HOLE * 0.62;
  R_WEDGE_IN = R_DIAL * 1.01;
  CX = W / 2;
  CY = H * 0.60;                          // lock sits below center, sign above
}
window.addEventListener("resize", resize);
resize();

// ---------- Game state ----------
let phase = "menu";           // menu | playing | gameover
let timeLeft, score, elapsed;
let angle, dir;               // needle angle (rad), direction (+1 ccw / -1 cw in math coords)
let curSpeed;                 // actual needle speed (rad/s)
let boostMult;                // 1..MAX_SPEED_MULT, ramps while RMB held
let missState;                // 0 = normal, 2 = stalled, 3 = recovering
let stallTimer;               // countdown for the full-stop dwell
let blueChance;               // escalating pity chance for blue wedges
let fastHeld = false;
let spawnTimer;
let arcs = [];                // {center, half, color}
let floaters = [];            // {x, y, text, color, age}
let centerFloaters = [];      // "+1.5" style popups on the dial {text, color, age}
let flashes = [];             // rim flashes {color, age}
let sparkles = [];            // needle trail + capture bursts
                              // {x, y, vx, vy, age, life, size, color, drag, grav}
let timerPulse = 0;
let best = 0;

function reset() {
  timeLeft = START_TIME;
  score = 0;
  elapsed = 0;
  angle = -Math.PI / 2;
  dir = 1;
  curSpeed = BASE_SPEED;
  boostMult = 1;
  missState = 0;
  stallTimer = 0;
  blueChance = BLUE_BASE_CHANCE;
  spawnTimer = 0.4;
  arcs = [];
  floaters = [];
  centerFloaters = [];
  flashes = [];
  sparkles = [];
  timerPulse = 0;
}

// ---------- Angle helpers ----------
function norm(a) {
  a %= TAU;
  return a < 0 ? a + TAU : a;
}
function angDist(a, b) {
  const d = Math.abs(norm(a) - norm(b));
  return Math.min(d, TAU - d);
}
function needleOnArc(arc) {
  return angDist(angle, arc.center) <= arc.half + NEEDLE_GRACE;
}

// spark burst at the needle's position on the ring when a wedge is captured
function spawnBurst(ang, color) {
  const r0 = (R_WEDGE_IN + R_WEDGE_OUT) / 2;
  const bx = CX + Math.cos(ang) * r0;
  const by = CY - Math.sin(ang) * r0;
  const palette = color === "blue"
    ? ["#6fc3ff", "#a8dcff", "#ffffff", "#3fa9ff"]
    : ["#ffdf6b", "#ffc93f", "#ffffff", "#ffb347"];
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * TAU;
    const sp = 60 + Math.random() * 260;
    sparkles.push({
      x: bx, y: by,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      age: 0, life: 0.45 + Math.random() * 0.45,
      size: 1.5 + Math.random() * 2.2,
      color: palette[(Math.random() * palette.length) | 0],
      drag: 2.5, grav: 140,
    });
  }
}

// ---------- Spawning ----------
function trySpawnArc() {
  if (arcs.length >= MAX_ARCS) return;
  const half = WEDGE_SIZE / 2;
  for (let attempt = 0; attempt < 12; attempt++) {
    const center = Math.random() * TAU;
    // keep new wedges from spawning right under the needle
    if (angDist(center, angle) < half + 0.25) continue;
    let clear = true;
    for (const a of arcs) {
      // MIN_GAP is center-to-center (wedges may spawn touching edge-to-edge);
      // the max() only prevents actual overlap with wider neighbors
      if (angDist(center, a.center) < Math.max(half + a.half, MIN_GAP)) { clear = false; break; }
    }
    if (clear) {
      // escalating pity: each yellow spawn raises the blue chance until one lands
      const isBlue = Math.random() < blueChance;
      blueChance = isBlue ? BLUE_BASE_CHANCE : blueChance + BLUE_ESCALATION;
      arcs.push({ center, half, color: isBlue ? "blue" : "yellow" });
      return;
    }
  }
}

// ---------- Input ----------
canvas.addEventListener("contextmenu", e => e.preventDefault());

function startRun() {
  reset();
  phase = "playing";
}

canvas.addEventListener("mousedown", e => {
  if (e.button === 2) {
    if (!fastHeld) playSfx("boost", 0.45);
    fastHeld = true;
    return;
  }
  if (e.button !== 0) return;

  if (phase === "menu" || phase === "gameover") {
    startRun();
    return;
  }

  // left click during play: try to capture
  let hitIndex = -1;
  for (let i = 0; i < arcs.length; i++) {
    if (needleOnArc(arcs[i])) { hitIndex = i; break; }
  }
  if (hitIndex >= 0) {
    const arc = arcs[hitIndex];
    score += HIT_SCORE;
    playSfx("success", 0.6);
    if (arc.color === "blue") {
      timeLeft += BLUE_TIME_BONUS;
      timerPulse = 1;
      centerFloaters.push({ text: "+" + BLUE_TIME_BONUS.toFixed(1), color: "#7fd0ff", age: 0 });
    }
    dir = -dir;      // reverse direction, same speed
    missState = 0;   // capturing clears any slow penalty
    curSpeed = BASE_SPEED * boostMult;
    const fr = (R_WEDGE_IN + R_WEDGE_OUT) / 2;
    floaters.push({
      x: CX + Math.cos(arc.center) * fr,
      y: CY - Math.sin(arc.center) * fr,
      text: "+" + HIT_SCORE, color: "#ffe98a", age: 0,
    });
    flashes.push({ color: arc.color === "blue" ? "#4db8ff" : "#ffd23f", age: 0 });
    spawnBurst(angle, arc.color);
    slarkReact = 0.35;
    arcs.splice(hitIndex, 1);
  } else {
    // miss: instant dead stop, brief stall, then quick recovery.
    // Boost is forfeited — it must recompound from 1x after recovery.
    // Clicks during an active penalty are ignored (no vdata cooldown param
    // exists; the penalty itself is the minimum interval between misses).
    if (missState !== 0) return;
    curSpeed = 0;
    missState = 2;
    stallTimer = MISS_STALL;
    boostMult = 1;
    playSfx("miss", 0.6);
    flashes.push({ color: "#ff4d4d", age: 0 });
  }
});

window.addEventListener("mouseup", e => {
  if (e.button === 2) fastHeld = false;
});
window.addEventListener("blur", () => { fastHeld = false; });

window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") startRun();
});

// ---------- Update ----------
function update(dt) {
  // effects keep animating even on menu/gameover screens
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].age += dt;
    if (floaters[i].age > 1.1) floaters.splice(i, 1);
  }
  for (let i = centerFloaters.length - 1; i >= 0; i--) {
    centerFloaters[i].age += dt;
    if (centerFloaters[i].age > 1.0) centerFloaters.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].age += dt;
    if (flashes[i].age > 0.35) flashes.splice(i, 1);
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.age += dt;
    if (s.drag) {
      const d = Math.max(0, 1 - s.drag * dt);
      s.vx *= d; s.vy *= d;
    }
    if (s.grav) s.vy += s.grav * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.age > s.life) sparkles.splice(i, 1);
  }
  timerPulse = Math.max(0, timerPulse - dt * 2.5);

  // slark idle blinking
  slarkBlink = Math.max(0, slarkBlink - dt);
  slarkReact = Math.max(0, slarkReact - dt);
  slarkNext -= dt;
  if (slarkNext <= 0) {
    slarkBlink = 0.13;
    slarkNext = 2 + Math.random() * 3;
  }

  if (phase !== "playing") return;

  elapsed += dt;
  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    phase = "gameover";
    best = Math.max(best, score);
    return;
  }

  // boost multiplier compounds while RMB is held, decays when released.
  // It is pinned at 1x for the duration of the miss penalty.
  if (missState === 0) {
    if (fastHeld) {
      boostMult = Math.min(MAX_SPEED_MULT, boostMult * (1 + BOOST_RAMP * dt));
    } else {
      boostMult = Math.max(1, boostMult * (1 - BOOST_DECAY * dt));
    }
  }
  const targetSpeed = BASE_SPEED * boostMult;

  if (missState === 2) {
    // dwell at a full stop so the miss reads clearly
    stallTimer -= dt;
    if (stallTimer <= 0) missState = 3;
  } else if (missState === 3) {
    // constant acceleration back up to speed
    curSpeed += RECOVER_ACCEL * dt;
    if (curSpeed >= targetSpeed) { curSpeed = targetSpeed; missState = 0; }
  } else {
    curSpeed = targetSpeed;
  }
  angle = norm(angle + dir * curSpeed * dt);

  // needle sparkle trail
  for (let i = 0; i < 2; i++) {
    const rr = R_DIAL * 0.3 + Math.random() * (R_WEDGE_OUT - R_DIAL * 0.3);
    const jitter = (Math.random() - 0.5) * 0.05;
    sparkles.push({
      x: CX + Math.cos(angle + jitter) * rr,
      y: CY - Math.sin(angle + jitter) * rr,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      age: 0, life: 0.5,
      size: 1.6, color: "#b48cff",
      drag: 0, grav: 0,
    });
  }

  // wedges shrink and expire (WEDGE_SHRINK deg/s per side, so a fresh
  // wedge lasts ~4.3s — matches the original's faster decay)
  for (let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i];
    a.half -= WEDGE_SHRINK * dt;
    if (a.half <= 1 * DEG) arcs.splice(i, 1);
  }

  // spawn rate ramps up over time
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    trySpawnArc();
    spawnTimer = Math.max(SPAWN_MIN, SPAWN_BASE - elapsed * SPAWN_RAMP);
  }
}

// ---------- Draw helpers ----------
function annularWedge(centerAng, halfAng, rIn, rOut) {
  // canvas arcs are clockwise in screen coords; math angles are negated
  const a0 = -(centerAng - halfAng);
  const a1 = -(centerAng + halfAng);
  ctx.beginPath();
  ctx.arc(CX, CY, rOut, a0, a1, true);
  ctx.arc(CX, CY, rIn, a1, a0, false);
  ctx.closePath();
}

function smallCaps(text, x, y, sizePx, color, spacing) {
  ctx.font = `600 ${sizePx}px ${FONT}`;
  ctx.fillStyle = color;
  const chars = text.split("");
  let total = 0;
  for (const c of chars) total += ctx.measureText(c).width + spacing;
  total -= spacing;
  let cx = x - total / 2;
  ctx.textAlign = "left";
  for (const c of chars) {
    ctx.fillText(c, cx, y);
    cx += ctx.measureText(c).width + spacing;
  }
  ctx.textAlign = "center";
}

// ---------- Draw ----------
function draw() {
  if (imgsLoaded < imgsTotal) {
    ctx.fillStyle = "#0b0e14";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#8d8578";
    ctx.font = `500 16px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Loading…", CX, CY);
    return;
  }

  // ---- dungeon background, cover-fit ----
  const bg = IMGS.bg;
  const scale = Math.max(W / bg.width, H / bg.height);
  const bw = bg.width * scale, bh = bg.height * scale;
  ctx.drawImage(bg, (W - bw) / 2, (H - bh) / 2, bw, bh);

  // ---- slark peeking over the lock (behind sign, shackle and lock body) ----
  {
    // reaction frame wins over blink, else idle
    const frame = slarkReact > 0 ? 8 : (slarkBlink > 0 ? 1 : 0);
    const col = frame % SLARK_COLS, row = Math.floor(frame / SLARK_COLS);
    const headW = R_LOCK * 1.05;
    const headH = headW * (SLARK_FH / SLARK_FW);
    const hx = CX - headW / 2;
    const hy = CY - R_LOCK * 0.55 - headH;
    ctx.drawImage(IMGS.slark, col * SLARK_FW, row * SLARK_FH, SLARK_FW, SLARK_FH,
                  hx, hy, headW, headH);
  }

  // ---- hanging sign with title ----
  const signW = Math.min(W * 0.42, R_LOCK * 1.35);
  const signH = signW * (IMGS.sign.height / IMGS.sign.width);
  const signX = CX - signW / 2;
  const signY = -signH * 0.06; // chains run off the top of the screen
  ctx.drawImage(IMGS.sign, signX, signY, signW, signH);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `700 ${Math.round(signW * 0.085)}px ${FONT}`;
  ctx.fillStyle = "#d9c18a";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 6;
  ctx.fillText("PICK THE LOCK", CX, signY + signH * 0.70);
  ctx.shadowBlur = 0;

  // ---- rim flashes (hit/miss feedback), behind the lock ----
  for (const f of flashes) {
    const k = 1 - f.age / 0.35;
    ctx.beginPath();
    ctx.arc(CX, CY, R_LOCK + 4 + 10 * k, 0, TAU);
    ctx.strokeStyle = f.color;
    ctx.globalAlpha = 0.45 * k;
    ctx.lineWidth = 8 + 10 * k;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- shackle behind the lock body ----
  const shW = R_LOCK * 1.5;
  const shH = shW * (IMGS.shank.height / IMGS.shank.width);
  ctx.drawImage(IMGS.shank, CX - shW / 2, CY - R_LOCK * 0.55 - shH, shW, shH);

  // ---- lock body (face circle center matches image center 345,346 of 700px) ----
  const lockDraw = R_LOCK / (345 / 700); // full image width when face radius = R_LOCK
  ctx.drawImage(IMGS.lock, CX - lockDraw * (345 / 700), CY - lockDraw * (346 / 700), lockDraw, lockDraw);

  // ---- wedges: filled pie segments in the recessed ring ----
  for (const a of arcs) {
    const half = a.half;
    const grad = ctx.createRadialGradient(CX, CY, R_WEDGE_IN, CX, CY, R_WEDGE_OUT);
    if (a.color === "blue") {
      grad.addColorStop(0, "#1d3f6e");
      grad.addColorStop(0.6, "#2f7fd6");
      grad.addColorStop(1, "#6fc3ff");
    } else {
      grad.addColorStop(0, "#7a5c14");
      grad.addColorStop(0.55, "#d9a721");
      grad.addColorStop(1, "#ffdf6b");
    }
    annularWedge(a.center, half, R_WEDGE_IN, R_WEDGE_OUT);
    ctx.fillStyle = grad;
    ctx.shadowColor = a.color === "blue" ? "#4db8ff" : "#ffc93f";
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
    // composite the lock face's scratch/crack texture into the wedge so the
    // color reads as a tinted overlay on the metal (the raw texture is nearly
    // black, so it needs a big brightness boost to modulate visibly)
    ctx.save();
    annularWedge(a.center, half, R_WEDGE_IN, R_WEDGE_OUT);
    ctx.clip();
    ctx.globalCompositeOperation = "overlay";
    ctx.filter = "grayscale(1) brightness(4) contrast(1.8)";
    const lockDrawW = R_LOCK / (345 / 700);
    ctx.drawImage(IMGS.lock, CX - lockDrawW * (345 / 700), CY - lockDrawW * (346 / 700),
                  lockDrawW, lockDrawW);
    ctx.filter = "none";
    ctx.restore();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = a.color === "blue" ? "rgba(180,225,255,0.55)" : "rgba(255,240,180,0.55)";
    ctx.stroke();
  }

  // ---- needle trail + capture spark bursts (additive for glow) ----
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const s of sparkles) {
    const k = 1 - s.age / s.life;
    ctx.globalAlpha = 0.8 * k;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * k + 0.3, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // ---- needle: thin glowing purple line from center to hole edge ----
  const nx = Math.cos(angle), ny = -Math.sin(angle);
  const penalized = missState !== 0;
  const needleGrad = ctx.createLinearGradient(CX, CY, CX + nx * R_WEDGE_OUT, CY + ny * R_WEDGE_OUT);
  if (penalized) {
    needleGrad.addColorStop(0, "rgba(255,110,80,0)");
    needleGrad.addColorStop(0.35, "#ff8d6b");
    needleGrad.addColorStop(1, "#ffd0b8");
  } else {
    needleGrad.addColorStop(0, "rgba(120,80,220,0)");
    needleGrad.addColorStop(0.35, "#8a5cff");
    needleGrad.addColorStop(1, "#e6d8ff");
  }
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + nx * R_WEDGE_OUT, CY + ny * R_WEDGE_OUT);
  ctx.strokeStyle = needleGrad;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.shadowColor = penalized ? "#ff6b4d" : "#9a6cff";
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;
  // bright tip
  ctx.beginPath();
  ctx.arc(CX + nx * R_WEDGE_OUT, CY + ny * R_WEDGE_OUT, 3, 0, TAU);
  ctx.fillStyle = penalized ? "#ffd0b8" : "#f0e8ff";
  ctx.shadowColor = penalized ? "#ff6b4d" : "#b48cff";
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;

  // ---- dial disc drawn over the needle so it hides its center portion ----
  ctx.drawImage(IMGS.dial, CX - R_DIAL, CY - R_DIAL, R_DIAL * 2, R_DIAL * 2);

  // ---- center text: +bonus / TIME REMAINING / time / SCORE / score ----
  if (phase !== "menu") {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const f of centerFloaters) {
      const k = f.age / 1.0;
      ctx.globalAlpha = 1 - k;
      ctx.font = `700 ${Math.round(R_DIAL * 0.2)}px ${FONT}`;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, CX, CY - R_DIAL * 0.52 - k * 14);
      ctx.globalAlpha = 1;
    }

    smallCaps("TIME REMAINING", CX, CY - R_DIAL * 0.26, Math.round(R_DIAL * 0.11), "#8d8578", 2);

    const pulse = timerPulse;
    let timerColor = "#efe9dc";
    if (pulse > 0) timerColor = "#6effa1";
    else if (phase === "playing" && timeLeft < 5) timerColor = "#ff6b6b";
    ctx.font = `700 ${Math.round(R_DIAL * 0.5)}px ${FONT}`;
    ctx.fillStyle = timerColor;
    ctx.shadowColor = timerColor;
    ctx.shadowBlur = pulse > 0 ? 22 * pulse : 6;
    ctx.fillText(timeLeft.toFixed(1), CX, CY + R_DIAL * 0.06);
    ctx.shadowBlur = 0;

    smallCaps("SCORE", CX, CY + R_DIAL * 0.42, Math.round(R_DIAL * 0.11), "#8d8578", 2);
    ctx.font = `700 ${Math.round(R_DIAL * 0.22)}px ${FONT}`;
    ctx.fillStyle = "#ffe98a";
    ctx.fillText(score.toLocaleString(), CX, CY + R_DIAL * 0.66);
  }

  // floating score texts over the ring
  for (const f of floaters) {
    const k = f.age / 1.1;
    ctx.globalAlpha = 1 - k;
    ctx.font = `700 ${Math.round(R_LOCK * 0.09)}px ${FONT}`;
    ctx.fillStyle = f.color;
    ctx.textAlign = "center";
    ctx.fillText(f.text, f.x, f.y - k * 40);
    ctx.globalAlpha = 1;
  }

  // overlays
  if (phase === "menu") {
    drawOverlayText(
      "Left click when the needle is over a zone • blue zones give +1.5s",
      "Hold right mouse to speed up • missing slows you down • R restarts",
      "Click to start");
  } else if (phase === "gameover") {
    drawOverlayText(
      "Final score: " + score.toLocaleString(),
      best > 0 ? "Best: " + best.toLocaleString() : "",
      "Click or press R to play again");
  } else {
    ctx.textAlign = "center";
    ctx.font = `500 13px ${FONT}`;
    ctx.fillStyle = "rgba(200,190,170,0.55)";
    ctx.fillText("LMB capture • hold RMB to speed up • R to restart", CX, H - 14);
  }
}

function drawOverlayText(line1, line2, cta) {
  // dim everything below the sign
  ctx.fillStyle = "rgba(8,7,9,0.55)";
  ctx.fillRect(0, 0, W, H);
  // redraw the sign over the dim layer so the title stays bright
  const signW = Math.min(W * 0.42, R_LOCK * 1.35);
  const signH = signW * (IMGS.sign.height / IMGS.sign.width);
  const signX = CX - signW / 2;
  const signY = -signH * 0.06;
  ctx.drawImage(IMGS.sign, signX, signY, signW, signH);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `700 ${Math.round(signW * 0.085)}px ${FONT}`;
  ctx.fillStyle = "#d9c18a";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 6;
  ctx.fillText("PICK THE LOCK", CX, signY + signH * 0.70);
  ctx.shadowBlur = 0;

  ctx.font = `500 ${Math.round(R_LOCK * 0.07)}px ${FONT}`;
  ctx.fillStyle = "#cfc4a6";
  if (line1) ctx.fillText(line1, CX, CY - R_LOCK * 0.15);
  if (line2) ctx.fillText(line2, CX, CY);
  const blink = 0.6 + 0.4 * Math.sin(performance.now() / 300);
  ctx.globalAlpha = blink;
  ctx.font = `700 ${Math.round(R_LOCK * 0.09)}px ${FONT}`;
  ctx.fillStyle = "#ffe98a";
  ctx.fillText(cta, CX, CY + R_LOCK * 0.3);
  ctx.globalAlpha = 1;
}

// ---------- Main loop ----------
reset(); // initialize state so the menu frame has a valid needle angle
if (location.hash === "#autostart") startRun(); // for automated screenshots/testing
let lastT = performance.now();
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05); // clamp to avoid tab-switch jumps
  lastT = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
