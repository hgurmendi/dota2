# Cloudflare Worker: serves the static site and the leaderboard API from one
# deployment. See issue #2 for the plan and DEPLOY.md for the setup checklist.
#
# Everything that can live in version control does. The only things that can't
# are the two secrets — Cloudflare stores those encrypted and never returns
# them, so they are set once with `wrangler secret put` (see DEPLOY.md) and
# must never appear in this file, which is committed.

name = "pickthelock"
main = "worker/index.js"
compatibility_date = "2026-07-01"

# The site root is the repo root. .assetsignore keeps server code, docs, tests
# and tooling out of the upload entirely, so only the actual site is published.
[assets]
directory = "."
binding = "ASSETS"
# The Worker owns /api/*; every other path is answered from static assets
# without invoking it, which is both faster and not billed.
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Runs before every deploy, locally and in Workers Builds. The leaderboard
# rests on a run being reproducible from its seed and inputs, so a change that
# breaks determinism must not be deployable — a failing command fails the
# deploy. This replaces the test gate that lived in the old Pages build script.
[build]
command = "npm test"

# database_id is an identifier, not a credential, so it belongs in the repo.
# Apply the schema with `npm run db:init`.
#
# The binding is DB, not the database name Cloudflare's snippet suggests —
# leaderboard/handlers.js reads env.DB.
[[d1_databases]]
binding = "DB"
database_name = "pickthelock"
database_id = "811b3ca7-b723-403d-9dfb-e12b04e2ae87"

# Uncomment to serve the Worker from the real domain. Until then it is
# reachable at <name>.<subdomain>.workers.dev.
# [[routes]]
# pattern = "example.com"
# custom_domain = true

# [vars] holds non-secret configuration only.
# SITE_ORIGIN is needed when the public origin differs from the request origin
# (behind a proxy, or to pin the OpenID return_to to the canonical domain).
# [vars]
# SITE_ORIGIN = "https://example.com"
